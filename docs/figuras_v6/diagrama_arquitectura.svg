<svg width="1240" height="980" viewBox="0 0 1240 980" xmlns="http://www.w3.org/2000/svg">
<style>
  .t    {font:700 22px Arial,Helvetica,sans-serif;fill:#eef0ff;text-anchor:middle}
  .st   {font:400 12.5px Arial,Helvetica,sans-serif;fill:#8f8fc0;text-anchor:middle}
