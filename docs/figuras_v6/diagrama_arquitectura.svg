</style>
<rect width="1240" height="980" fill="#1a1a2e"/>
<defs>
  <marker id="am" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#9aa0c8"/></marker>
  <marker id="ao" markerWidth="9" markerHeight="9" refX="7.5" refY="3.2" orient="auto"><path d="M0,0 L7.5,3.2 L0,6.4 z" fill="#d99a4a"/></marker>
  <marker id="am2" markerWidth="9" markerHeight="9" refX="1.5" refY="3.2" orient="auto"><path d="M7.5,0 L0,3.2 L7.5,6.4 z" fill="#9aa0c8"/></marker>
</defs>

<text class="t"  x="620" y="44">Figura — Arquitectura del Sistema</text>
<text class="st" x="620" y="70">4 servicios en contenedor sobre la red tesis_network · 3 volúmenes persistentes · 2 dependencias externas</text>

<!-- ===== dependencias externas ===== -->
<rect x="180" y="108" width="880" height="140" rx="10" fill="none" stroke="#8a7a4a" stroke-width="1.4" stroke-dasharray="7,5"/>
