<rect x="62" y="348" width="1116" height="500" rx="10" fill="none" stroke="#5a5a80" stroke-width="1.4" stroke-dasharray="7,5"/>
<text class="cap" x="82" y="372">docker-compose.yml · red tesis_network (bridge)</text>

<rect x="318" y="392" width="584" height="34" rx="8" fill="#4a90d9"/>
