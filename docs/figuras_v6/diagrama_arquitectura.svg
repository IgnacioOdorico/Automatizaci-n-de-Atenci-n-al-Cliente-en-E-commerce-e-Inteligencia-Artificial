  .h    {font:700 15px Arial,Helvetica,sans-serif;fill:#ffffff;text-anchor:middle}
  .l1   {font:700 12.5px Arial,Helvetica,sans-serif;fill:#dfe3ff;text-anchor:middle}
  .l2   {font:400 11.5px Arial,Helvetica,sans-serif;fill:#c3c8e8;text-anchor:middle}
