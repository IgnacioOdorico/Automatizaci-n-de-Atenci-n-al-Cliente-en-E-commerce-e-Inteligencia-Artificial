<rect x="225" y="142" width="370" height="90" rx="9" fill="#2c2440" stroke="#d99a4a" stroke-width="1.8"/>
<text class="l1" x="410" y="172">OpenAI API — GPT-4o-mini</text>
<text class="l2" x="410" y="192">Clasificación de intents y generación de respuesta</text>
<text class="l3" x="410" y="211" fill="#d99a4a">dependencia crítica (§5.4.1)</text>

<rect x="645" y="142" width="370" height="90" rx="9" fill="#242c46" stroke="#4a90d9" stroke-width="1.8"/>
<text class="l1" x="830" y="172">Telegram Bot API</text>
<text class="l2" x="830" y="192">Canal real del chatbot</text>
<text class="l3" x="830" y="211">webhook entrante y saliente</text>

<path d="M410 232 L410 340" fill="none" stroke="#d99a4a" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#ao)"/>
<text class="edge" x="443" y="290" fill="#d99a4a">HTTPS</text>
<path d="M830 232 L830 340" fill="none" stroke="#d99a4a" stroke-width="1.8" stroke-dasharray="7,5" marker-end="url(#ao)"/>
<text class="edge" x="863" y="290" fill="#d99a4a">HTTPS</text>

